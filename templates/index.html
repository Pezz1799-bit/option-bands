
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Option Bands</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0b1020;--panel:#121a2c;--line:#26324a;--text:#eef3ff;--muted:#8fa0bd;--accent:#78a7ff;--green:#51d7a2;--red:#ff7d8d;--amber:#ffc96b}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,Segoe UI,sans-serif}
header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px}.sub{color:var(--muted)}
main{padding:22px;max-width:1500px;margin:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:grid;gap:6px;color:var(--muted);font-size:12px} input,select,button{height:42px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:0 12px;font-size:14px}
input{min-width:260px}button{background:var(--accent);color:#08101f;border:0;font-weight:800;cursor:pointer}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin-top:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
#chart{height:590px}.metrics{display:grid;gap:10px}.metric{padding:12px;border-bottom:1px solid var(--line)}.metric:last-child{border:0}.metric b{display:block;font-size:21px;margin-top:3px}.muted{color:var(--muted)}.error{margin-top:14px;color:#ffd0d5}.ok{color:var(--green)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
#results{position:absolute;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:360px;max-height:300px;overflow:auto;display:none}
.res{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line)}.res:hover{background:#18233b}
@media(max-width:850px){.grid{grid-template-columns:1fr}#chart{height:460px}.metrics{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div><div class="brand">Option Bands</div><div class="sub">NYSE + Nasdaq · Market cap ≥ $1B · Bande IV asimmetriche</div></div></header>
<main>
<div class="toolbar">
<div style="position:relative"><label>Ticker o società<input id="ticker" value="AAPL" autocomplete="off"></label><div id="results"></div></div>
<button id="load">Carica</button>
<label>Scadenza<select id="exp" disabled><option>—</option></select></label>
<button id="bands" disabled>Aggiorna bande</button>
</div>
<div id="msg" class="error"></div>
<div class="grid">
<div class="card">
<div id="title" style="font-size:18px;font-weight:800">Seleziona un titolo</div>
<div class="legend"><span>Prezzo</span><span>+1σ / +2σ</span><span>−1σ / −2σ</span></div>
<div id="chart"></div>
</div>
<div class="card metrics">
<div class="metric"><span class="muted">Prezzo</span><b id="spot">—</b></div>
<div class="metric"><span class="muted">IV Put ~25Δ</span><b id="piv">—</b></div>
<div class="metric"><span class="muted">IV ATM</span><b id="aiv">—</b></div>
<div class="metric"><span class="muted">IV Call ~25Δ</span><b id="civ">—</b></div>
<div class="metric"><span class="muted">Skew Put − Call</span><b id="skew">—</b></div>
<div class="metric"><span class="muted">Banda 1σ</span><b id="one">—</b></div>
<div class="metric"><span class="muted">Banda 2σ</span><b id="two">—</b></div>
<div class="metric"><span class="muted">Scadenza</span><b id="dte">—</b></div>
</div>
</div>
</main>
<script>
const $=id=>document.getElementById(id); let chart,candles,lines=[];
function money(x){return x==null?'—':'$'+Number(x).toFixed(2)}
function pct(x){return x==null?'—':(Number(x)*100).toFixed(2)+'%'}
function cap(x){if(!x)return ''; return '$'+(x/1e9).toFixed(1)+'B'}
function clearLines(){lines.forEach(l=>{try{candles.removePriceLine(l)}catch(e){}});lines=[]}
function addLine(price,title,color,style=2){lines.push(candles.createPriceLine({price,title,color,lineWidth:1,lineStyle:style,axisLabelVisible:true}))}
function initChart(){
 if(chart) chart.remove();
 chart=LightweightCharts.createChart($('chart'),{layout:{background:{color:'#121a2c'},textColor:'#8fa0bd'},grid:{vertLines:{color:'#1b263d'},horzLines:{color:'#1b263d'}},rightPriceScale:{borderColor:'#26324a'},timeScale:{borderColor:'#26324a',timeVisible:false}});
 candles=chart.addCandlestickSeries({upColor:'#51d7a2',downColor:'#ff7d8d',borderVisible:false,wickUpColor:'#51d7a2',wickDownColor:'#ff7d8d'});
 new ResizeObserver(()=>chart.applyOptions({width:$('chart').clientWidth})).observe($('chart'));
}
initChart();
async function loadTicker(){
 const t=$('ticker').value.trim().toUpperCase(); if(!t)return;
 $('msg').textContent='Caricamento dati…'; $('load').disabled=true;
 try{
  const r=await fetch('/api/ticker/'+encodeURIComponent(t)); const j=await r.json(); if(!r.ok)throw Error(j.error||'Errore');
  $('title').textContent=`${j.ticker} · ${j.name} · ${cap(j.market_cap)}`;
  candles.setData(j.bars.map(b=>({time:new Date(b.t).toISOString().slice(0,10),open:b.o,high:b.h,low:b.l,close:b.c})));
  chart.timeScale().fitContent(); clearLines();
  $('exp').innerHTML=j.expirations.map(e=>`<option value="${e}">${e}</option>`).join('');
  $('exp').disabled=!j.expirations.length; $('bands').disabled=!j.expirations.length;
  $('msg').textContent=j.expirations.length?'':'Nessuna scadenza opzioni disponibile.';
  if(j.expirations.length) await loadBands();
 }catch(e){$('msg').textContent=e.message} finally{$('load').disabled=false}
}
async function loadBands(){
 const t=$('ticker').value.trim().toUpperCase(), e=$('exp').value; if(!e)return;
 $('msg').textContent='Calcolo bande…'; $('bands').disabled=true;
 try{
  const r=await fetch(`/api/options/${encodeURIComponent(t)}?expiration=${encodeURIComponent(e)}`); const j=await r.json(); if(!r.ok)throw Error(j.error||'Errore');
  clearLines(); const b=j.bands;
  addLine(b.upper2,'+2σ','#ffc96b'); addLine(b.upper1,'+1σ','#51d7a2');
  addLine(b.lower1,'−1σ','#ff7d8d'); addLine(b.lower2,'−2σ','#d56cff');
  $('spot').textContent=money(j.spot); $('piv').textContent=pct(j.put_iv); $('aiv').textContent=pct(j.atm_iv); $('civ').textContent=pct(j.call_iv);
  $('skew').textContent=(j.skew*100).toFixed(2)+' pt'; $('one').textContent=`${money(b.lower1)} → ${money(b.upper1)}`; $('two').textContent=`${money(b.lower2)} → ${money(b.upper2)}`; $('dte').textContent=`${j.expiration} · ${j.dte} gg`;
  $('msg').textContent=`25Δ Put strike ${j.put_strike} · 25Δ Call strike ${j.call_strike}`;
 }catch(e){$('msg').textContent=e.message} finally{$('bands').disabled=false}
}
let timer;
$('ticker').addEventListener('input',()=>{clearTimeout(timer);const q=$('ticker').value.trim(); if(q.length<2){$('results').style.display='none';return} timer=setTimeout(async()=>{try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const j=await r.json();if(!r.ok)return;$('results').innerHTML=(j.results||[]).map(x=>`<div class="res" data-t="${x.ticker}"><b>${x.ticker}</b> ${x.name}<br><span class="muted">${cap(x.market_cap)}</span></div>`).join('');$('results').style.display=j.results?.length?'block':'none';document.querySelectorAll('.res').forEach(el=>el.addEventListener('click',()=>{$('ticker').value=el.dataset.t;$('results').style.display='none';loadTicker()}))}catch(e){}},350)});
$('load').addEventListener('click',loadTicker); $('bands').addEventListener('click',loadBands); $('exp').addEventListener('change',loadBands); $('ticker').addEventListener('keydown',e=>{if(e.key==='Enter')loadTicker()});
</script>
</body></html>
